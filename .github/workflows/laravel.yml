name: Laravel

on:
  push:
    branches: [ "5.x" ]
  pull_request:
    branches: [ "5.x" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis
          coverage: none

      # pest-plugin-type-coverage keeps a *mutable* cache inside the cached tree
      # (.temp/vN.php, a `<?php return array(...)` file). A run killed mid-write —
      # `cancel-in-progress` does exactly that, and racing forks are a second way in —
      # leaves it truncated, and since the key is keyed on composer.json the poisoned
      # entry latches until that file changes, parse-erroring every later run (#1687).
      # So: never save it, and drop whatever an older entry restores.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            !vendor/pestphp/pest-plugin-type-coverage/.temp
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Drop the type-coverage plugin's mutable cache
        run: rm -rf vendor/pestphp/pest-plugin-type-coverage/.temp

      - name: Check Coding Standards
        run: composer run test:lint

      - name: Static Analysis
        run: composer run test:types

      - name: Type Coverage
        run: composer run test:type-coverage

  test:
    name: Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_web
          POSTGRES_USER: seatplus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatplus -d laravel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis
          coverage: none

      # pest-plugin-type-coverage keeps a *mutable* cache inside the cached tree
      # (.temp/vN.php, a `<?php return array(...)` file). A run killed mid-write —
      # `cancel-in-progress` does exactly that, and racing forks are a second way in —
      # leaves it truncated, and since the key is keyed on composer.json the poisoned
      # entry latches until that file changes, parse-erroring every later run (#1687).
      # So: never save it, and drop whatever an older entry restores.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            !vendor/pestphp/pest-plugin-type-coverage/.temp
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Drop the type-coverage plugin's mutable cache
        run: rm -rf vendor/pestphp/pest-plugin-type-coverage/.temp

      - name: Run Tests
        run: vendor/bin/pest --no-coverage --shard=${{ matrix.shard }}/4

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # No `vite build` here on purpose: the frontend imports Wayfinder-generated
      # @/actions, which only exist inside a real app (this is a package — no artisan).
      # The full production build is validated by the "Browser (vs core)" job, which
      # runs `php artisan wayfinder:generate` against core. eslint has no import
      # resolver, so linting needs no generated files.
      - name: Lint
        run: npm run lint

  browser:
    name: Browser (vs core)
    runs-on: ubuntu-latest

    permissions:
      contents: write        # push screenshots to an orphan review branch
      pull-requests: write   # upsert the screenshot review comment

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: seatplus
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: seatplus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatplus -d laravel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Assemble a real app: core at 5.x, with THIS PR checked out in place at
      # core/packages/web (a path repo core resolves seatplus/web from).
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          repository: seatplus/core
          ref: 5.x
          path: core

      - name: Checkout this PR's web into core
        uses: actions/checkout@v7
        with:
          path: core/packages/web

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis, sockets
          coverage: none

      # Give the overlaid path package an explicit version so core's
      # `seatplus/web: ^5.0` resolves straight to it (a path repo is canonical /
      # top-priority). Avoids the detached-checkout dev-<sha> version mismatch.
      - name: Resolve core against the overlaid web
        working-directory: core
        run: |
          python3 -c "import json; f='packages/web/composer.json'; d=json.load(open(f)); d['version']='5.99.99'; json.dump(d, open(f,'w'), indent=4)"
          composer config repositories.web '{"type":"path","url":"packages/web"}'
          composer update seatplus/web -W --no-interaction --no-scripts

      - name: Prepare app env + publish assets
        working-directory: core
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan vendor:publish --tag=web-static --force
          php artisan vendor:publish --tag=web --force
          # Wayfinder actions/routes are gitignored; generate them in the real app so
          # the build resolves the frontend's @/actions imports.
          php artisan wayfinder:generate

      - name: Copy this PR's browser tests into core
        working-directory: core
        run: |
          mkdir -p tests/Browser/web
          cp -R packages/web/tests/Browser/. tests/Browser/web/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # `playwright` is a devDependency of this package's package.json (which the
      # web-static publish put at core/package.json), so plain `npm install` brings
      # in the driver — only the browser binary still needs a separate download.
      - name: Build assets + Playwright
        working-directory: core
        run: |
          npm install
          npm run build
          npm run playwright:install

      - name: Run browser tests
        working-directory: core
        run: vendor/bin/pest tests/Browser --no-coverage

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-screenshots
          path: core/tests/Browser/Screenshots/
          if-no-files-found: warn
          retention-days: 7

      # Publish the screenshots so they can be reviewed inline on the PR instead of
      # downloading the zip. GitHub markdown can only embed hosted images, so push this run's
      # PNGs to a tiny orphan branch (single force-pushed commit — no history growth; web is
      # public so raw.githubusercontent URLs render) and build a sticky comment from them.
      # (Borrowed from core's Browser workflow; screenshots live under core/ here because the
      # tests run against the assembled app in that directory.)
      - name: Stage screenshots for the PR comment
        id: screenshots
        if: always() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC=core/tests/Browser/Screenshots
          mapfile -t shots < <(find "$SRC" -type f -name '*.png' 2>/dev/null | sort)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "has_screenshots=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="screenshots-pr-${PR}"
          work="$(mktemp -d)"
          for f in "${shots[@]}"; do cp "$f" "$work/$(basename "$f")"; done

          git -C "$work" init -q
          git -C "$work" checkout -q --orphan shots
          git -C "$work" add .
          git -C "$work" -c user.name='seatplus-ci' -c user.email='ci@seatplus.local' \
            commit -q -m "browser screenshots for PR #${PR} (${GITHUB_SHA})"
          git -C "$work" push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "shots:${branch}"

          comment="$RUNNER_TEMP/screenshots-comment.md"
          {
            echo "<!-- browser-screenshots -->"
            echo "## 📸 Browser test screenshots"
            echo
            echo "Run [#${GITHUB_RUN_ID}](https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}) · commit \`$(echo "${GITHUB_SHA}" | cut -c1-7)\` · status **${{ job.status }}**"
            echo
            echo "| View | Desktop | iPhone |"
            echo "| --- | --- | --- |"
            # One row per view. Screenshots are named "<view>-desktop.png" / "<view>-iphone.png"
            # (see snap()); derive the unique view names and look each device file up by name in
            # $work. Plain string iteration — no associative arrays — so an all-suffixed set (the
            # normal case) can't trip "unbound variable" under `set -u`.
            base_url="https://raw.githubusercontent.com/${REPO}/${branch}"
            printf '%s\n' "${shots[@]}" | sed -E 's|.*/||; s|\.png$||; s/-(desktop|iphone)$//' | sort -u \
              | while IFS= read -r view; do
                  [ -z "$view" ] && continue
                  dcell="—"; icell="—"
                  [ -f "$work/${view}-desktop.png" ] && dcell="<img src=\"${base_url}/${view}-desktop.png\" width=\"420\">"
                  [ -f "$work/${view}-iphone.png" ]  && icell="<img src=\"${base_url}/${view}-iphone.png\" width=\"220\">"
                  echo "| \`${view}\` | ${dcell} | ${icell} |"
                done
          } > "$comment"

          echo "has_screenshots=true" >> "$GITHUB_OUTPUT"
          echo "comment_path=$comment" >> "$GITHUB_OUTPUT"

      - name: Find existing screenshot comment
        id: find_comment
        if: always() && steps.screenshots.outputs.has_screenshots == 'true'
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- browser-screenshots -->'

      - name: Upsert screenshot comment
        if: always() && steps.screenshots.outputs.has_screenshots == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.screenshots.outputs.comment_path }}
          edit-mode: replace

  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, browser]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.browser.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"

